<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Gestão Clínica — Redirecionando</title>
<meta http-equiv="refresh" content="0; url=https://sistemasdias.github.io/index.html?c=anna-carolina">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f6f5;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    color: #1f2d2a;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 32px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    max-width: 360px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; color: #0F6E56; }
  p { font-size: 14px; color: #5a6b66; margin: 0 0 20px; }
  a {
    display: inline-block;
    background: #0F6E56;
    color: #fff;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
  }
</style>
<script>
  // Remove qualquer Service Worker antigo registrado neste domínio
  // (importante para quem tem o app instalado como PWA a partir deste link)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for (var reg of registrations) { reg.unregister(); }
    });
  }
  // Limpa caches antigos do Service Worker, se houver
  if ('caches' in window) {
    caches.keys().then(function(names) {
      for (var name of names) { caches.delete(name); }
    });
  }
  window.location.replace('https://sistemasdias.github.io/index.html?c=anna-carolina');
</script>
</head>
<body>
  <div class="card">
    <h1>Este endereço mudou</h1>
    <p>O sistema agora está em sistemasdias.github.io. Você será redirecionado automaticamente.</p>
    <a href="https://sistemasdias.github.io/index.html?c=anna-carolina">Acessar o sistema</a>
  </div>
</body>
</html>
