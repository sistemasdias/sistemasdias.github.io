<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181C">
<title>Cartão da família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFF1F3; --surface:#FFFFFF; --ink:#15181C; --muted:#6C757D;
  --line:#DDE1E6; --line-soft:#EBEEF1; --alert:#B3261E; --ok:#1B6E4C;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:78px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.hide{display:none!important}

/* ---------- login ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px}
#login .box{width:100%;max-width:330px}
#login h1{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-bottom:6px}
#login p{color:var(--muted);font-size:14px;margin-bottom:26px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px}
.field input:focus,.field select:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:transparent}
.btn{width:100%;background:var(--ink);color:#fff;border-radius:10px;padding:12px;font-size:15px;font-weight:500}
.btn:disabled{opacity:.45}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.erro{color:var(--alert);font-size:13px;margin-top:10px;min-height:18px}

/* ---------- topo ---------- */
header{padding:20px 0 4px}
.mesnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mesnav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:17px;line-height:1;background:var(--surface)}
.mesnav button:hover{color:var(--ink);border-color:var(--ink)}
.mesnav h2{font-size:15px;font-weight:500;text-transform:capitalize}
.mesnav small{display:block;color:var(--muted);font-size:12px;font-weight:400}

/* ---------- herói: total + fatia por pessoa ---------- */
.total{padding:22px 0 0}
.total .v{font-size:44px;font-weight:700;letter-spacing:-.035em;line-height:1}
.total .cap{color:var(--muted);font-size:13px;margin-top:7px}
.barra{display:flex;height:11px;border-radius:99px;overflow:hidden;background:var(--line-soft);margin:20px 0 16px}
.barra span{transition:width .35s ease}
.pessoas{display:flex;flex-direction:column;gap:2px}
.pessoa{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.pessoa:last-child{border-bottom:none}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.pessoa .n{flex:1;font-size:15px}
.pessoa .p{color:var(--muted);font-size:12.5px;min-width:38px;text-align:right}
.pessoa .v{font-weight:600;font-size:15px;min-width:92px;text-align:right}

/* ---------- blocos ---------- */
section.bloco{margin-top:30px}
section.bloco > h3{font-size:14px;font-weight:600;margin-bottom:12px}
section.bloco > h3 span{color:var(--muted);font-weight:400}
.vazio{color:var(--muted);font-size:14px;line-height:1.5;padding:16px 0}

/* futuro */
.futuro{display:flex;gap:7px;align-items:flex-end;height:84px}
.fcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.fcol i{width:100%;background:var(--ink);border-radius:5px 5px 0 0;min-height:3px;opacity:.82;display:block}
.fcol b{font-size:11px;font-weight:500;color:var(--muted)}
.fcol em{font-size:10.5px;font-style:normal;color:var(--muted)}

/* lista de lançamentos */
.lanc{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.lanc .em{width:34px;height:34px;border-radius:9px;background:var(--line-soft);display:grid;place-items:center;font-size:16px;flex:none}
.lanc .mid{flex:1;min-width:0}
.lanc .d{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lanc .s{color:var(--muted);font-size:12px;margin-top:2px;display:flex;align-items:center;gap:6px}
.lanc .s i{width:7px;height:7px;border-radius:2px;font-style:normal;flex:none}
.lanc .r{text-align:right;flex:none}
.lanc .r b{font-weight:600;font-size:14.5px;display:block}
.lanc .r u{text-decoration:none;color:var(--muted);font-size:11.5px}
.lanc .x{color:var(--muted);font-size:17px;padding:0 2px;flex:none}
.lanc .x:hover{color:var(--alert)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 8px;font-size:11.5px;color:var(--muted)}

/* categorias */
.cat{display:flex;align-items:center;gap:10px;padding:9px 0}
.cat .n{flex:1;font-size:14px}
.cat .bar{height:6px;background:var(--line-soft);border-radius:99px;width:82px;overflow:hidden}
.cat .bar i{display:block;height:100%;background:var(--ink);opacity:.75}
.cat .v{font-size:13.5px;font-weight:500;min-width:80px;text-align:right}

/* formulário */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.parc{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.parc button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 0;font-size:13.5px;flex:1;min-width:46px}
.parc button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.previa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin:14px 0;font-size:13.5px;line-height:1.55;color:var(--muted)}
.previa b{color:var(--ink);font-weight:600}

/* cartões / membros */
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px}
.item .mid{flex:1}
.item .t{font-size:14.5px;font-weight:500}
.item .s{color:var(--muted);font-size:12.5px;margin-top:2px}

/* navegação inferior */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:7px 0 max(7px,env(safe-area-inset-bottom))}
nav .wrap{display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;padding:5px 0}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 17px;border-radius:10px;font-size:13.5px;z-index:9;max-width:88vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="box">
    <h1>Cartão da família</h1>
    <p>Entre para ver a fatura do mês e lançar um gasto.</p>
    <div class="field"><label for="em">E-mail</label><input id="em" type="email" autocomplete="username"></div>
    <div class="field"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn" id="btEntrar">Entrar</button>
    <div class="erro" id="loginErro"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<main id="app" class="hide">

  <!-- FATURA -->
  <div id="tab-fatura" class="tab">
    <div class="wrap">
      <header>
        <div class="mesnav">
          <button id="mesAnt" aria-label="Mês anterior">‹</button>
          <h2 id="mesTit">—<small id="mesSub"></small></h2>
          <button id="mesProx" aria-label="Próximo mês">›</button>
        </div>
      </header>

      <div class="total">
        <div class="v num" id="fatTotal">R$ 0,00</div>
        <div class="cap" id="fatCap">nenhum gasto lançado neste mês</div>
        <div class="barra" id="fatBarra"></div>
        <div class="pessoas" id="fatPessoas"></div>
      </div>

      <section class="bloco" id="secFuturo">
        <h3>Parcelas a vencer <span id="futuroTot"></span></h3>
        <div class="futuro" id="futuro"></div>
      </section>

      <section class="bloco" id="secCat">
        <h3>Onde foi o dinheiro</h3>
        <div id="cats"></div>
      </section>
    </div>
  </div>

  <!-- LANÇAR -->
  <div id="tab-lancar" class="tab hide">
    <div class="wrap">
      <header><div class="mesnav"><h2>Novo gasto</h2></div></header>
      <div style="margin-top:18px">
        <div class="field"><label for="fDesc">O que foi</label><input id="fDesc" placeholder="lanche, gasolina, geladeira…"></div>
        <div class="grid2">
          <div class="field"><label for="fValor">Valor total</label><input id="fValor" type="text" inputmode="decimal" placeholder="0,00"></div>
          <div class="field"><label for="fData">Data da compra</label><input id="fData" type="date"></div>
        </div>
        <div class="field"><label>Parcelas</label>
          <div class="parc" id="fParc"></div>
        </div>
        <div class="grid2">
          <div class="field"><label for="fMembro">Quem gastou</label><select id="fMembro"></select></div>
          <div class="field"><label for="fCartao">Cartão</label><select id="fCartao"></select></div>
        </div>
        <div class="previa" id="fPrevia">Preencha o valor para ver como cai na fatura.</div>
        <button class="btn" id="btSalvar">Lançar gasto</button>
        <div class="erro" id="fErro"></div>
      </div>
    </div>
  </div>

  <!-- EXTRATO -->
  <div id="tab-extrato" class="tab hide">
    <div class="wrap">
      <header>
        <div class="mesnav">
          <button id="exAnt" aria-label="Mês anterior">‹</button>
          <h2 id="exTit">—</h2>
          <button id="exProx" aria-label="Próximo mês">›</button>
        </div>
      </header>
      <div class="field" style="margin-top:16px"><label for="exMembro">Filtrar por pessoa</label><select id="exMembro"></select></div>
      <div id="exLista"></div>
    </div>
  </div>

  <!-- AJUSTES -->
  <div id="tab-ajustes" class="tab hide">
    <div class="wrap">
      <header><div class="mesnav"><h2>Ajustes</h2></div></header>

      <section class="bloco">
        <h3>Cartões</h3>
        <div id="listaCartoes"></div>
        <div id="formCartao" class="hide">
          <div class="field"><label for="cApelido">Apelido</label><input id="cApelido" placeholder="Nubank, Itaú…"></div>
          <div class="grid2">
            <div class="field"><label for="cFech">Fecha dia</label><input id="cFech" type="number" min="1" max="31" value="25"></div>
            <div class="field"><label for="cVenc">Vence dia</label><input id="cVenc" type="number" min="1" max="31" value="5"></div>
          </div>
          <div class="field"><label for="cLim">Limite (opcional)</label><input id="cLim" type="text" inputmode="decimal" placeholder="0,00"></div>
          <button class="btn" id="btSalvarCartao">Salvar cartão</button>
        </div>
        <button class="btn ghost" id="btNovoCartao" style="margin-top:8px">Adicionar cartão</button>
      </section>

      <section class="bloco">
        <h3>Pessoas <span>quem pode lançar pelo WhatsApp</span></h3>
        <div id="listaMembros"></div>
        <div id="formMembro" class="hide">
          <div class="field"><label for="mNome">Nome</label><input id="mNome" placeholder="Nome da pessoa"></div>
          <div class="field"><label for="mTel">WhatsApp com DDD</label><input id="mTel" inputmode="tel" placeholder="17 99999-0000"></div>
          <div class="grid2">
            <div class="field"><label for="mCor">Cor</label><input id="mCor" type="color" value="#5B6B7A" style="height:44px;padding:4px"></div>
            <div class="field"><label for="mCartao">Cartão padrão</label><select id="mCartao"></select></div>
          </div>
          <button class="btn" id="btSalvarMembro">Salvar pessoa</button>
        </div>
        <button class="btn ghost" id="btNovoMembro" style="margin-top:8px">Adicionar pessoa</button>
      </section>

      <section class="bloco">
        <button class="btn ghost" id="btSair">Sair da conta</button>
      </section>
    </div>
  </div>
</main>

<nav id="nav" class="hide">
  <div class="wrap">
    <button data-tab="fatura" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h10"/></svg>Fatura</button>
    <button data-tab="lancar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Lançar</button>
    <button data-tab="extrato"><svg viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6"/></svg>Extrato</button>
    <button data-tab="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>Ajustes</button>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://nathaeuqbeqlvkftbmes.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Vfc0LObDm13-g74oZ6-xXg_gb5bbtYn';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const brl = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const MES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const num = t => { const s=String(t||'').replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.'); const v=parseFloat(s); return isNaN(v)?0:v; };
const hoje = () => new Date();
const comp = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
const ymd  = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

let EU=null, MEMBROS=[], CARTOES=[], REF=new Date(), REF_EX=new Date(), PARC=1;

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ---------------- sessão ---------------- */
$('#btEntrar').onclick = async () => {
  const b=$('#btEntrar'); b.disabled=true; $('#loginErro').textContent='';
  const {error} = await sb.auth.signInWithPassword({email:$('#em').value.trim(), password:$('#pw').value});
  b.disabled=false;
  if(error){ $('#loginErro').textContent='E-mail ou senha não conferem.'; return; }
  iniciar();
};
$('#pw').addEventListener('keydown', e => { if(e.key==='Enter') $('#btEntrar').click(); });
$('#btSair').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function iniciar(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user) return;
  const {data:eu} = await sb.from('fin_membros').select('*').eq('user_id', user.id).maybeSingle();
  if(!eu){ $('#loginErro').textContent='Esta conta ainda não está cadastrada como pessoa da família.'; await sb.auth.signOut(); return; }
  EU = eu;
  $('#login').classList.add('hide'); $('#app').classList.remove('hide'); $('#nav').classList.remove('hide');
  $('#fData').value = ymd(hoje());
  montarParcelas();
  await carregarBase();
  await Promise.all([renderFatura(), renderExtrato()]);
}

async function carregarBase(){
  const [m,c] = await Promise.all([
    sb.from('fin_membros').select('*').eq('ativo',true).order('nome'),
    sb.from('fin_cartoes').select('*').eq('ativo',true).order('apelido')
  ]);
  MEMBROS = m.data||[]; CARTOES = c.data||[];

  const opMem = MEMBROS.map(x=>`<option value="${x.id}">${x.nome}</option>`).join('');
  $('#fMembro').innerHTML = opMem;
  $('#fMembro').value = EU.id;
  $('#fMembro').disabled = !EU.admin;
  $('#exMembro').innerHTML = `<option value="">Todo mundo</option>`+opMem;
  const opCar = `<option value="">Sem cartão</option>`+CARTOES.map(x=>`<option value="${x.id}">${x.apelido}</option>`).join('');
  $('#fCartao').innerHTML = opCar; $('#mCartao').innerHTML = opCar;
  if(EU.cartao_padrao_id) $('#fCartao').value = EU.cartao_padrao_id;
  else if(CARTOES.length===1) $('#fCartao').value = CARTOES[0].id;
  renderAjustes();
}

/* ---------------- abas ---------------- */
$$('#nav button').forEach(b => b.onclick = () => {
  $$('#nav button').forEach(x=>x.removeAttribute('aria-current'));
  b.setAttribute('aria-current','page');
  $$('.tab').forEach(t=>t.classList.add('hide'));
  $('#tab-'+b.dataset.tab).classList.remove('hide');
  window.scrollTo(0,0);
});

/* ---------------- fatura ---------------- */
$('#mesAnt').onclick  = () => { REF.setMonth(REF.getMonth()-1); renderFatura(); };
$('#mesProx').onclick = () => { REF.setMonth(REF.getMonth()+1); renderFatura(); };

async function renderFatura(){
  const c = comp(REF);
  $('#mesTit').childNodes[0].nodeValue = MES[REF.getMonth()]+' de '+REF.getFullYear();

  const {data:rows} = await sb.from('fin_vw_parcelas').select('*').eq('competencia', c);
  const lista = rows||[];
  const total = lista.reduce((s,r)=>s+Number(r.valor),0);
  $('#fatTotal').textContent = brl(total);

  const venc = lista.length ? new Date(lista[0].vencimento+'T12:00:00') : null;
  $('#mesSub').textContent = venc ? 'vence em '+venc.toLocaleDateString('pt-BR') : '';
  $('#fatCap').textContent = lista.length
    ? `${lista.length} ${lista.length===1?'lançamento':'lançamentos'} nesta fatura`
    : 'nenhum gasto lançado neste mês';

  // por pessoa
  const pm = {};
  lista.forEach(r => { pm[r.membro_id] = pm[r.membro_id] || {nome:r.membro, cor:r.membro_cor, v:0};
                       pm[r.membro_id].v += Number(r.valor); });
  const pessoas = Object.values(pm).sort((a,b)=>b.v-a.v);
  $('#fatBarra').innerHTML = pessoas.map(p =>
    `<span style="width:${total?(p.v/total*100):0}%;background:${p.cor}"></span>`).join('');
  $('#fatPessoas').innerHTML = pessoas.length ? pessoas.map(p => `
    <div class="pessoa">
      <i class="dot" style="background:${p.cor}"></i>
      <span class="n">${p.nome}</span>
      <span class="p num">${total?Math.round(p.v/total*100):0}%</span>
      <span class="v num">${brl(p.v)}</span>
    </div>`).join('') : '';

  // a vencer
  const {data:fut} = await sb.from('fin_parcelas').select('competencia,valor').gt('competencia', c);
  const agr = {};
  (fut||[]).forEach(r => agr[r.competencia] = (agr[r.competencia]||0)+Number(r.valor));
  const meses = Object.keys(agr).sort().slice(0,6);
  const totFut = Object.values(agr).reduce((s,v)=>s+v,0);
  if(meses.length){
    $('#secFuturo').classList.remove('hide');
    $('#futuroTot').textContent = '· '+brl(totFut)+' no total';
    const max = Math.max(...meses.map(m=>agr[m]));
    $('#futuro').innerHTML = meses.map(m => {
      const d = new Date(m+'T12:00:00');
      return `<div class="fcol">
        <em class="num">${Math.round(agr[m])}</em>
        <i style="height:${Math.max(4,agr[m]/max*54)}px"></i>
        <b>${MES3[d.getMonth()]}</b></div>`;
    }).join('');
  } else $('#secFuturo').classList.add('hide');

  // categorias
  const pc = {};
  lista.forEach(r => { const k=(r.categoria_emoji||'📦')+' '+(r.categoria||'Outros');
                       pc[k]=(pc[k]||0)+Number(r.valor); });
  const cats = Object.entries(pc).sort((a,b)=>b[1]-a[1]);
  if(cats.length){
    $('#secCat').classList.remove('hide');
    const max = cats[0][1];
    $('#cats').innerHTML = cats.map(([k,v]) => `
      <div class="cat">
        <span class="n">${k}</span>
        <span class="bar"><i style="width:${v/max*100}%"></i></span>
        <span class="v num">${brl(v)}</span>
      </div>`).join('');
  } else $('#secCat').classList.add('hide');
}

/* ---------------- lançar ---------------- */
function montarParcelas(){
  $('#fParc').innerHTML = [1,2,3,4,5,6,10,12].map(n =>
    `<button type="button" data-n="${n}" aria-pressed="${n===1}">${n}x</button>`).join('');
  $$('#fParc button').forEach(b => b.onclick = () => {
    PARC = +b.dataset.n;
    $$('#fParc button').forEach(x=>x.setAttribute('aria-pressed', x===b));
    previa();
  });
}
['#fValor','#fData','#fCartao'].forEach(s => $(s).addEventListener('input', previa));

function previa(){
  const v = num($('#fValor').value);
  if(!v){ $('#fPrevia').textContent = 'Preencha o valor para ver como cai na fatura.'; return; }
  const cart = CARTOES.find(c=>c.id===$('#fCartao').value);
  const d = new Date(($('#fData').value||ymd(hoje()))+'T12:00:00');
  let mes = new Date(d.getFullYear(), d.getMonth(), 1);
  if(cart && cart.dia_fechamento && d.getDate() > cart.dia_fechamento) mes.setMonth(mes.getMonth()+1);
  const p = (v/PARC);
  $('#fPrevia').innerHTML = PARC === 1
    ? `Entra inteiro na fatura de <b>${MES[mes.getMonth()]}</b> · <b>${brl(v)}</b>`
    : `<b>${PARC}x de ${brl(p)}</b> · primeira em <b>${MES[mes.getMonth()]}</b>, última em <b>${MES[(mes.getMonth()+PARC-1)%12]}</b>`;
}

$('#btSalvar').onclick = async () => {
  const desc = $('#fDesc').value.trim(), valor = num($('#fValor').value);
  $('#fErro').textContent='';
  if(!desc){ $('#fErro').textContent='Escreva o que foi comprado.'; return; }
  if(valor<=0){ $('#fErro').textContent='Informe um valor maior que zero.'; return; }
  const b=$('#btSalvar'); b.disabled=true;
  const {error} = await sb.from('fin_lancamentos').insert({
    membro_id: $('#fMembro').value, cartao_id: $('#fCartao').value || null,
    descricao: desc, valor_total: valor, parcelas: PARC,
    data_compra: $('#fData').value || ymd(hoje()), origem:'manual'
  });
  b.disabled=false;
  if(error){ $('#fErro').textContent='Não deu para salvar: '+error.message; return; }
  $('#fDesc').value=''; $('#fValor').value=''; PARC=1; montarParcelas(); previa();
  toast('Gasto lançado');
  renderFatura(); renderExtrato();
};

/* ---------------- extrato ---------------- */
$('#exAnt').onclick  = () => { REF_EX.setMonth(REF_EX.getMonth()-1); renderExtrato(); };
$('#exProx').onclick = () => { REF_EX.setMonth(REF_EX.getMonth()+1); renderExtrato(); };
$('#exMembro').onchange = renderExtrato;

async function renderExtrato(){
  $('#exTit').textContent = MES[REF_EX.getMonth()]+' de '+REF_EX.getFullYear();
  let q = sb.from('fin_vw_parcelas').select('*').eq('competencia', comp(REF_EX)).order('data_compra',{ascending:false});
  if($('#exMembro').value) q = q.eq('membro_id', $('#exMembro').value);
  const {data} = await q;
  const rows = data||[];
  if(!rows.length){ $('#exLista').innerHTML = '<p class="vazio">Nenhum lançamento neste mês para esse filtro.</p>'; return; }
  $('#exLista').innerHTML = rows.map(r => {
    const d = new Date(r.data_compra+'T12:00:00');
    const podeApagar = EU.admin || r.membro_id === EU.id;
    return `<div class="lanc">
      <span class="em">${r.categoria_emoji||'📦'}</span>
      <span class="mid">
        <span class="d">${r.descricao}</span>
        <span class="s"><i style="background:${r.membro_cor}"></i>${r.membro} · ${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}${r.cartao?' · '+r.cartao:''}${r.origem==='whatsapp'?' · zap':''}</span>
      </span>
      <span class="r">
        <b class="num">${brl(r.valor)}</b>
        ${r.total_parcelas>1?`<u class="num">${r.numero}/${r.total_parcelas} de ${brl(r.valor_total)}</u>`:''}
      </span>
      ${podeApagar?`<button class="x" data-del="${r.lancamento_id}" aria-label="Apagar">×</button>`:''}
    </div>`;
  }).join('');
  $$('#exLista [data-del]').forEach(b => b.onclick = async () => {
    if(!confirm('Apagar este lançamento? Se for parcelado, todas as parcelas somem.')) return;
    const {error} = await sb.from('fin_lancamentos').delete().eq('id', b.dataset.del);
    if(error){ toast('Não deu para apagar'); return; }
    toast('Lançamento apagado'); renderFatura(); renderExtrato();
  });
}

/* ---------------- ajustes ---------------- */
function renderAjustes(){
  $('#listaCartoes').innerHTML = CARTOES.length ? CARTOES.map(c => `
    <div class="item">
      <span class="dot" style="background:${c.cor};width:14px;height:22px;border-radius:4px"></span>
      <span class="mid"><span class="t">${c.apelido}</span>
        <span class="s">fecha dia ${c.dia_fechamento||'—'} · vence dia ${c.dia_vencimento||'—'}${c.limite?' · limite '+brl(c.limite):''}</span></span>
    </div>`).join('') : '<p class="vazio">Nenhum cartão cadastrado. Sem cartão, o gasto entra na fatura do próprio mês da compra.</p>';

  $('#listaMembros').innerHTML = MEMBROS.map(m => `
    <div class="item">
      <span class="dot" style="background:${m.cor};width:14px;height:22px;border-radius:4px"></span>
      <span class="mid"><span class="t">${m.nome}${m.admin?' <span class="chip">admin</span>':''}</span>
        <span class="s">${m.telefone ? m.telefone : 'sem WhatsApp cadastrado'}</span></span>
    </div>`).join('');

  const so = EU.admin;
  $('#btNovoCartao').classList.toggle('hide', !so);
  $('#btNovoMembro').classList.toggle('hide', !so);
}
$('#btNovoCartao').onclick = () => { $('#formCartao').classList.toggle('hide'); $('#btNovoCartao').classList.add('hide'); };
$('#btNovoMembro').onclick = () => { $('#formMembro').classList.toggle('hide'); $('#btNovoMembro').classList.add('hide'); };

$('#btSalvarCartao').onclick = async () => {
  const ap = $('#cApelido').value.trim();
  if(!ap){ toast('Dê um apelido ao cartão'); return; }
  const {error} = await sb.from('fin_cartoes').insert({
    apelido: ap, dia_fechamento: +$('#cFech').value||null, dia_vencimento: +$('#cVenc').value||null,
    limite: num($('#cLim').value)||null
  });
  if(error){ toast('Erro: '+error.message); return; }
  $('#cApelido').value=''; $('#cLim').value='';
  $('#formCartao').classList.add('hide'); $('#btNovoCartao').classList.remove('hide');
  toast('Cartão salvo'); await carregarBase();
};

$('#btSalvarMembro').onclick = async () => {
  const nome = $('#mNome').value.trim();
  if(!nome){ toast('Informe o nome'); return; }
  const tel = $('#mTel').value.replace(/\D/g,'');
  const {error} = await sb.from('fin_membros').insert({
    nome, telefone: tel ? (tel.length<=11 ? '55'+tel : tel) : null,
    cor: $('#mCor').value, cartao_padrao_id: $('#mCartao').value || null
  });
  if(error){ toast('Erro: '+error.message); return; }
  $('#mNome').value=''; $('#mTel').value='';
  $('#formMembro').classList.add('hide'); $('#btNovoMembro').classList.remove('hide');
  toast('Pessoa cadastrada'); await carregarBase();
};

/* ---------------- start ---------------- */
sb.auth.getSession().then(({data}) => { if(data.session) iniciar(); });
</script>
</body>
</html>
